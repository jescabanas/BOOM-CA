<!doctype html>
<html lang="en" data-theme-scope="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Compliance Submissions — Barangay Compliance System</title>
    <link rel="stylesheet" href="css/styles.css?v=20261007-submission-columns" />
    <script src="js/theme.js?v=20261003-internal-theme"></script>
    <script src="js/period-filter.js?v=20261008-admin-deadlines"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
  <script src="js/password-toggle.js?v=20261005" defer></script></head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img src="assets/images/DILG-Logo-new.png" alt="DILG Seal" class="brand-seal" />
           <div class="brand-text">
            <div class="name">Barangay<br>Compliance<br>System</div>
          </div>
        </div>
        <nav id="sidebar-nav"></nav>
        <div class="theme-toggle-mount" id="theme-toggle-mount"></div>        <div class="sidebar-footer">
          <a href="#" onclick="logout()" style="color: inherit">Sign out</a>
        </div>
      </aside>
      <main class="main">
        <div class="topbar">
          <div class="page-title">
            <div class="eyebrow">My Compliance Submissions</div>
            <h1 id="barangay-name" style="margin: 0">Barangay</h1>
          </div>
          <div class="user-chip" id="user-chip"></div>
        </div>
        <div class="period-filter-row" id="submissions-period-filter"></div>
        <div class="period-filter-row"><label for="submission-type">Compliance type</label><select id="submission-type"><option value="">All types</option><option>Weekly</option><option>Monthly</option><option>Quarterly</option><option>Semestral</option><option value="Annual">Annual</option></select></div>
        <section id="tab-current"><div id="compliance-list" class="submission-grid"></div></section>
      </main>
    </div>

    <div
      id="submission-modal"
      role="dialog" aria-modal="true" aria-labelledby="submission-title"
      style="
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(11, 31, 58, 0.5);
        align-items: center;
        justify-content: center;
        z-index: 100;
        overflow: auto;
        padding: 24px;
      "
    >
      <div class="card review-modal-card">
        <div class="dialog-heading">
          <div>
            <div class="eyebrow">Barangay Compliance Submission</div>
            <h3 id="submission-title" style="margin: 0.25rem 0"></h3>
            <div
              id="submission-deadline"
              style="font-size: 13px; color: var(--color-ink-600)"
            ></div>
          </div>
          <button class="btn btn-outline dialog-close" id="cancel-submission" aria-label="Close submission editor">
            ×
          </button>
        </div>
        <div id="existing-movs" style="margin: 18px 0"></div>
        <h4 style="margin: 14px 0 8px">Add MOV files</h4>
        <p style="font-size: 13px; color: var(--color-ink-600); margin-top: 0">
          At least one evidence file is required. Each MOV can support one or more
          mandate categories.
        </p>
        <div id="mov-entries"></div>
        <button class="btn btn-outline" id="add-mov">+ Add MOV</button>
        <div class="field" style="margin-top: 16px">
          <label for="submission-notes">Remarks / notes (optional)</label
          ><textarea id="submission-notes" rows="3"></textarea>
        </div>
        <div
          id="submission-error"
          style="
            display: none;
            color: var(--color-danger);
            font-size: 13px;
            margin: 10px 0;
          "
        ></div>
        <div class="dialog-actions">
          <button class="btn btn-primary" id="submit-compliance">
            Submit Compliance
          </button>
        </div>
      </div>
    </div>

    <script src="env.js"></script>
    <script src="js/supabaseClient.js?v=20260806-authfix"></script>
    <script src="js/mfa-config.js?v=20261003-totp"></script><script src="js/mfa-service.js?v=20261003-totp"></script><script src="js/mfa-session.js?v=20261003-totp"></script><script src="js/protected-files.js?v=20261003-totp"></script><script src="js/auth.js?v=20261003-totp"></script>
    <script src="js/layout.js?v=20261007-barangay-analytics"></script>
    <script src="js/document-preview.js?v=20261003-totp"></script>
    <script>
      let currentProfile,
        mandates = [],
        activeSubmission,
        activePeriod,
        existingDocuments = [],
        submissionsPeriod = { month: "", year: "" };
      const escapeHtml = (value) =>
        String(value ?? "").replace(
          /[&<>'"]/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[c],
        );
      const formatDate = (value) =>
        value
          ? new Date(value).toLocaleString("en-PH", {
              dateStyle: "medium",
              timeStyle: "short",
              timeZone: "Asia/Manila",
            })
          : "—";
      function deadlineHint(period) {
        const ms = new Date(period.deadline_at) - new Date();
        return ms < 0
          ? '<span style="color:var(--color-danger);">Deadline has passed</span>'
          : ms < 72 * 3600000
            ? '<span class="deadline-alert" role="img" tabindex="0" aria-label="Deadline approaching: less than 72 hours remaining.">!</span>'
            : "";
      }
      function displayStatus(s, period) {
        if (!s?.submitted_at) return ["neutral", "Pending"];
        // Timeliness is based on the official first submission, not the
        // current clock or a later resubmission. Reject stale date-only bands.
        const submittedAt = Date.parse(s.submitted_at);
        const deadlineAt = Date.parse(period?.deadline_at);
        const hasTimes = Number.isFinite(submittedAt) && Number.isFinite(deadlineAt);
        const late = hasTimes ? submittedAt > deadlineAt : s.score_band === "late";
        if (s.status === "approved")
          return late ? ["danger", "Approved / submitted late"] : ["success", "Approved"];
        if (s.status === "correction_requested")
          return ["warning", "Returned / needs revision"];
        if (s.status === "rejected") return ["danger", "Rejected"];
        return [
          late ? "danger" : "warning",
          late
            ? "Submitted late / under review"
            : hasTimes || ["on_time", "grace_period"].includes(s.score_band)
              ? "Submitted on time / under review"
              : "Submitted / under review",
        ];
      }
      async function init() {
        currentProfile = await guardPage(["barangay_secretary"]);
        if (!currentProfile) return;
        renderSidebar("secretary.html", currentProfile.role); initThemeToggle("theme-toggle-mount");
        const [{ data: barangay }, { data: mandateRows }] = await Promise.all([
          supabaseClient
            .from("barangays")
            .select("name")
            .eq("id", currentProfile.barangay_id)
            .single(),
          supabaseClient
            .from("mandates")
            .select("id,title,category")
            .eq("status", "active")
            .order("category")
            .order("title"),
        ]);
        mandates = mandateRows || [];
        document.getElementById("barangay-name").textContent =
          barangay?.name || "";
        const today = currentComplianceDate();
        submissionsPeriod = { month: String(today.month), year: String(today.year) };
        document.getElementById('submission-type').onchange = loadCompliance;
        renderPeriodFilter(document.getElementById("submissions-period-filter"), {
          years: defaultPeriodYears(),
          month: submissionsPeriod.month,
          year: submissionsPeriod.year,
          onChange: ({ month, year }) => {
            submissionsPeriod = { month, year };
            loadCompliance();
          },
        });
        await loadCompliance();
      }
      async function loadCompliance() {
        // Populate any missing upcoming Week/Month/Quarter/Annual periods
        // before reading the secretary's list. The RPC is idempotent, so it
        // never replaces a deadline an administrator has already edited.
        const { error: scheduleError } = await supabaseClient.rpc("ensure_compliance_schedule_periods", { p_year: Number(submissionsPeriod.year) || currentComplianceDate().year });
        if (scheduleError) { showToast("Could not load the complete schedule. Please contact your administrator."); return; }
        const [
          { data: periods, error: periodError },
          { data: subs, error: subError },
          { data: schedules },
        ] = await Promise.all([
          // Fetch every real deadline. Open deadlines are available for a new
          // submission; closed deadlines remain visible whenever this barangay
          // already has a draft or submitted record, so "My Submissions" is
          // never a static, current-month-only list.
          supabaseClient
            .from("compliance_periods")
            .select("*")
            .order("deadline_at", { ascending: false }),
          supabaseClient
            .from("submissions")
            .select("*")
            .eq("barangay_id", currentProfile.barangay_id)
            .not("compliance_period_id", "is", null),
          supabaseClient.from('compliance_deadline_schedules').select('id,frequency'),
        ]);
        if (periodError || subError)
          return showToast(
            periodError?.message ||
              subError?.message ||
              "Could not load compliance submissions.",
          );
        const byPeriod = Object.fromEntries(
          (subs || []).map((s) => [s.compliance_period_id, s]),
        );
        const scheduleMap = Object.fromEntries((schedules || []).map(s => [s.id, s]));
        const selectedType = document.getElementById('submission-type').value;
        const visiblePeriods = (periods || [])
          .filter((p) => p.is_open || Boolean(byPeriod[p.id]))
          .filter(p => !selectedType || complianceFrequency(p, scheduleMap) === selectedType)
          .filter(p => (!submissionsPeriod.year || p.compliance_year === Number(submissionsPeriod.year)) && (!submissionsPeriod.month || complianceMonth(p) === Number(submissionsPeriod.month)))
          .sort((a, b) => new Date(a.deadline_at) - new Date(b.deadline_at));
        document.getElementById("compliance-list").innerHTML = visiblePeriods
          .length
          ? visiblePeriods
              .map((p) => {
                const s = byPeriod[p.id],
                  [cls, label] = displayStatus(s, p);
                const editable =
                  (p.is_open && !s) ||
                  Boolean(s && !s.is_locked && s.status !== "approved");
                const frequency = complianceFrequency(p, scheduleMap);
                return `<article class="card submission-card" data-compliance-type="${frequency}"><div class="submission-card-layout"><div class="submission-card-details"><div class="eyebrow">${escapeHtml(p.period_label)} ${p.compliance_year}</div><h3>${escapeHtml(p.title)}</h3><div class="submission-meta"><span>Start: ${formatDate(p.starts_at)}</span><span>End: ${formatDate(p.deadline_at)}</span></div>${s?.submitted_at ? `<div class="field-hint">Submitted: ${formatDate(s.last_submitted_at || s.submitted_at)}</div>` : ""}${s?.evaluator_remarks ? `<div style="font-size:13px;margin-top:7px;"><strong>Latest director remark:</strong> ${escapeHtml(s.evaluator_remarks)}</div>` : ""}</div><div class="submission-card-actions">${editable ? deadlineHint(p) : ""}<span class="pill ${cls}">${label}</span>${editable ? `<button class="btn btn-primary" onclick="openSubmission('${p.id}')">${s ? "Add MOV / Resubmit" : "Create submission"}</button>` : ""}</div></div></article>`;
              })
              .join("")
          : '<div class="card">No open compliance periods for this filter.</div>';
      }
      async function openSubmission(periodId) {
        const { data: period, error: periodError } = await supabaseClient
          .from("compliance_periods")
          .select("*")
          .eq("id", periodId)
          .single();
        if (periodError) return showToast(periodError.message);
        let { data: submission } = await supabaseClient
          .from("submissions")
          .select("*")
          .eq("barangay_id", currentProfile.barangay_id)
          .eq("compliance_period_id", periodId)
          .maybeSingle();
        if (!submission) {
          const result = await supabaseClient.rpc(
            "create_compliance_submission",
            { p_compliance_period_id: periodId },
          );
          if (result.error) return showToast(result.error.message);
          submission = result.data;
        }
        activeSubmission = submission;
        activePeriod = period;
        document.getElementById("submission-title").textContent = period.title;
        document.getElementById("submission-deadline").innerHTML =
          `<div class="submission-meta"><span>Start: ${formatDate(period.starts_at)}</span><span>End: ${formatDate(period.deadline_at)}</span>${deadlineHint(period)}</div>`;
        document.getElementById("submission-notes").value =
          submission.submission_notes || "";
        document.getElementById("mov-entries").innerHTML = "";
        document.getElementById("submission-error").style.display = "none";
        await loadExistingMovs();
        addMovEntry();
        document.getElementById("submission-modal").style.display = "flex";
        document.querySelector('#submission-modal .review-modal-card').scrollTop = 0;
      }
      async function loadExistingMovs() {
        const [{ data: docs, error: docsError }, { data: remarks }] = await Promise.all([
          supabaseClient
            .from("documents")
            .select(
              "id,file_name,file_size_bytes,storage_path,uploaded_at,document_mandates(mandate_id,mandates(title,category))",
            )
            .eq("submission_id", activeSubmission.id)
            .eq("is_current", true)
            .order("uploaded_at", { ascending: false }),
          supabaseClient
            .from("submission_remarks")
            .select("remark,created_at,documents(file_name),mandates(title)")
            .eq("submission_id", activeSubmission.id)
            .order("created_at", { ascending: false }),
        ]);
        if (docsError) throw new Error(docsError.message || "Could not load attachments.");
        existingDocuments = docs || [];
        const editable = !activeSubmission.is_locked && ['pending', 'under_review', 'correction_requested'].includes(activeSubmission.status);
        const fileCards = await Promise.all(existingDocuments.map(async (d) => {
          const categories = (d.document_mandates || []).map((x) => escapeHtml(x.mandates?.title || x.mandates?.category)).join(", ") || "No category selected";
          return `<article class="mov-file-card"><div class="mov-file-card-main"><strong>${escapeHtml(d.file_name)}</strong><div class="mov-file-meta">${categories}</div></div><div class="mov-file-actions"><button class="btn btn-outline btn-small" type="button" onclick="openProtectedDocument(decodeURIComponent('${encodeURIComponent(d.storage_path).replace(/'/g, '%27')}'), decodeURIComponent('${encodeURIComponent(d.file_name).replace(/'/g, '%27')}'))">Preview</button>${editable ? `<button class="btn btn-outline btn-small mov-remove-button" type="button" aria-label="Remove ${escapeHtml(d.file_name)}" onclick="removeMov('${d.id}', this)">×</button>` : ''}<div class="mov-file-time">${formatDate(d.uploaded_at)}</div></div></article>`;
        }));
        const files = fileCards.length
          ? `<h4 style="margin-bottom:8px;">Uploaded MOVs</h4><div class="mov-file-list">${fileCards.join("")}</div>`
          : "";
        const review = (remarks || []).length
          ? `<h4 style="margin:16px 0 8px;">Reviewer's remarks</h4>${remarks.map((r) => `<div style="font-size:13px;padding:8px 0;border-bottom:1px solid var(--color-line);"><strong>${formatDate(r.created_at)}</strong><br>${escapeHtml(r.remark)}${r.documents?.file_name ? `<div style="color:var(--color-ink-600);">Applies to MOV: ${escapeHtml(r.documents.file_name)}</div>` : ""}${r.mandates?.title ? `<div style="color:var(--color-ink-600);">Applies to category: ${escapeHtml(r.mandates.title)}</div>` : ""}</div>`).join("")}`
          : "";
        document.getElementById("existing-movs").innerHTML = files + review;
      }
      async function removeMov(documentId, button) {
        const doc = existingDocuments.find(d => d.id === documentId);
        if (!doc || !confirm(`Remove ${doc.file_name} from this submission? The previous file will remain in revision history.`)) return;
        button.disabled = true;
        try {
          const {error} = await supabaseClient.rpc('revise_submission_document', {p_document_id: documentId});
          if (error) throw error;
          document.querySelectorAll('.mov-entry').forEach(entry => { if (entry.dataset.replaces === documentId) entry.remove(); });
          await loadExistingMovs();
          showToast('File removed. Add a corrected file and resubmit when ready.');
        } catch (error) {
          showToast(error.message || 'Could not remove the file.');
          button.disabled = false;
        }
      }
      function addMovEntry() {
        const id =
          "mov-" + Date.now() + "-" + Math.random().toString(16).slice(2);
        const options = mandates
          .map(
            (m) =>
              `<label><input type="checkbox" class="mov-category-check" value="${m.id}" /><span>${escapeHtml(m.title)}<small>${escapeHtml(m.category)}</small></span></label>`,
          )
          .join("");
        document
          .getElementById("mov-entries")
          .insertAdjacentHTML(
            "beforeend",
            `<div class="mov-entry" id="${id}"><div class="mov-entry-header"><div><span class="mov-entry-kicker">Evidence file</span><strong>MOV attachment</strong></div><button type="button" class="btn btn-outline btn-small" onclick="document.getElementById('${id}').remove()">Remove</button></div><div class="field"><label for="${id}-file">Choose an evidence file</label><input id="${id}-file" type="file" class="mov-file" accept=".pdf,.docx,.xlsx,.zip,.jpg,.jpeg,.png,.mp4" /><div class="field-hint">PDF, documents, spreadsheets, images, ZIP or video.</div></div><div class="field"><label>Mandates supported</label><div class="mov-categories" role="group" aria-label="Mandates supported by this file">${options}</div><div class="field-hint">Select every mandate this file supports.</div></div></div>`,
          );
        return document.getElementById(id);
      }
      document.getElementById("add-mov").addEventListener("click", addMovEntry);
      document
        .getElementById("cancel-submission")
        .addEventListener(
          "click",
          () =>
            (document.getElementById("submission-modal").style.display =
              "none"),
        );
      document
        .getElementById("submit-compliance")
        .addEventListener("click", async () => {
          const errorBox = document.getElementById("submission-error");
          const submitButton = document.getElementById("submit-compliance");
          errorBox.style.display = "none";
          const entries = [...document.querySelectorAll(".mov-entry")];
          submitButton.disabled = true;
          submitButton.textContent = "Submitting…";
          try {
            if (!existingDocuments.length && !entries.some(entry => entry.querySelector(".mov-file").files[0]))
              throw new Error("Attach at least one MOV file before submitting compliance.");
            // Validate all entries before uploading any files.
            for (const entry of entries) {
              if (entry.dataset.replaces && !entry.querySelector('.mov-file').files[0])
                throw new Error('Choose a replacement file or remove its pending entry.');
              if (entry.querySelector('.mov-file').files[0]?.size === 0) throw new Error('Choose a non-empty evidence file.');
              if (entry.querySelector('.mov-file').files[0] && !entry.querySelector('.mov-category-check:checked'))
                throw new Error('Select at least one mandate category for every file.');
            }
            for (const entry of entries) {
              const file = entry.querySelector(".mov-file").files[0];
              if (!file) continue;
              const categories = [
                ...entry.querySelectorAll(".mov-category-check:checked"),
              ].map((o) => o.value);
              if (!categories.length)
                throw new Error(
                  `Select at least one mandate category for ${file.name}.`,
                );
              const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
              const storagePath = `${currentProfile.barangay_id}/${activeSubmission.id}/${crypto.randomUUID()}_${safeName}`;
              const { error: uploadError } = await supabaseClient.storage
                .from("mov-documents")
                .upload(storagePath, file);
              if (uploadError) throw uploadError;
              if (entry.dataset.replaces) {
                const {error: revisionError} = await supabaseClient.rpc('revise_submission_document', {
                  p_document_id: entry.dataset.replaces,
                  p_replacement: {file_name: file.name, storage_path: storagePath, file_type: file.type || file.name.split('.').pop(), file_size_bytes: file.size, mandate_ids: categories},
                });
                if (revisionError) throw revisionError;
                entry.remove();
                await loadExistingMovs();
                continue;
              }
              const {error: docError} = await supabaseClient.rpc('add_submission_document', {
                p_submission_id: activeSubmission.id,
                p_file: {file_name: file.name, storage_path: storagePath, file_type: file.type || file.name.split('.').pop(), file_size_bytes: file.size, mandate_ids: categories},
              });
              if (docError) throw docError;
              entry.remove();
              await loadExistingMovs();
            }
            const { error: submitError } = await supabaseClient.rpc(
              "submit_compliance_submission",
              {
                p_submission_id: activeSubmission.id,
                p_notes: document.getElementById("submission-notes").value,
              },
            );
            if (submitError) throw submitError;
            document.getElementById("submission-modal").style.display = "none";
            showToast("Compliance submission sent for review.");
            await loadCompliance();
          } catch (err) {
            errorBox.textContent =
              `Could not submit compliance: ${err.message || "Please try again."}`;
            errorBox.style.display = "block";
          } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Submit Compliance";
          }
        });
      init();
    </script>
    <style>
      .tab-btn {
        background: none;
        border: none;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        color: var(--color-ink-600);
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }
      .tab-btn.active {
        color: var(--color-navy-900);
        border-bottom-color: var(--color-gold-500);
      }
    </style>
  </body>
</html>
