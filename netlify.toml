[build]
  base = "frontend"
  publish = "."
  command = "sh generate-env.sh"

# Injects Supabase config into a generated env.js at build time so the
# anon key (safe to expose — RLS enforces access) is never hardcoded in
# source control. Set SUPABASE_URL and SUPABASE_ANON_KEY in Netlify's
# Site settings → Environment variables.
[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; frame-src 'self' blob:; connect-src 'self' blob: https://*.supabase.co;"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
