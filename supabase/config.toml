project_id = "smart-governance-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8888"
additional_redirect_urls = ["https://dilgtest2.netlify.app/reset-password.html", "http://localhost:8888/reset-password.html", "http://localhost:5500/DILGtest2/frontend/reset-password.html"]
jwt_expiry = 3600
enable_signup = false          # accounts are provisioned by Super Admin, not self-registration
enable_confirmations = true

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
# Invitation, recovery, confirmation, and magic-link tokens are valid for 12
# hours. A newly generated setup link replaces the previous one.
otp_expiry = 43200

[auth.mfa]
max_enrolled_factors = 10
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email.template.recovery]
subject = "DILG Lucena — Reset your Barangay Compliance System password"
content_path = "./supabase/templates/recovery.html"

[storage]
enabled = true
file_size_limit = "100MiB"

[functions]
[functions.score-submission]
verify_jwt = true
[functions.generate-report]
verify_jwt = true
[functions.notify]
verify_jwt = true
[functions.resend-user-invite]
verify_jwt = true
  [functions.create-user]
  verify_jwt = true

[functions.request-password-reset]
verify_jwt = false
[functions.submit-account-application]
verify_jwt = true
[functions.review-account-application]
verify_jwt = true
[functions.reset-user-mfa]
verify_jwt = true
[functions.change-secretary-password]
verify_jwt = true
